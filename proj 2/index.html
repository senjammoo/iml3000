<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>POLARIS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Cormorant+Garamond:ital,wght@1,300&family=Share+Tech+Mono&display=swap');

    :root {
      --void: #000000;
      --star-core: rgba(255, 255, 255, 0.95);
      --star-glow: rgba(180, 210, 255, 0.15);
      --deep-blue: rgba(40, 80, 180, 0.08);
      --rose-edge: rgba(255, 140, 100, 0.05);
    }

    body.home {
      background: radial-gradient(ellipse at 50% 40%,
        #05080f 0%,
        #020408 40%,
        #000000 100%
      );
      color: white;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Star field — fixed, layered dots */
    body.home::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 8% 12%,  rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 18% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 28% 8%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 38% 72%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 62% 18%, rgba(200,220,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 82% 42%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 92% 65%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  90%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 95%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 33% 45%, rgba(180,210,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 67% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 14% 35%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 28%, rgba(220,230,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 78%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 90%, rgba(255,255,255,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
      animation: slowDrift 90s linear infinite;
    }

    /* Polaris — the north star, fixed and bright at center-top */
    body.home::after {
      content: '';
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow:
        0 0 8px 2px rgba(255,255,255,0.9),
        0 0 20px 6px rgba(200,220,255,0.5),
        0 0 60px 20px rgba(150,190,255,0.15),
        0 0 120px 40px rgba(100,150,255,0.08);
      pointer-events: none;
      z-index: 2;
      animation: polarisBreath 4s ease-in-out infinite;
    }

    @keyframes slowDrift {
      0%   { transform: translateY(0)   translateX(0); }
      33%  { transform: translateY(-6px) translateX(3px); }
      66%  { transform: translateY(3px)  translateX(-4px); }
      100% { transform: translateY(0)   translateX(0); }
    }

    @keyframes polarisBreath {
      0%, 100% {
        box-shadow:
          0 0 8px 2px rgba(255,255,255,0.9),
          0 0 20px 6px rgba(200,220,255,0.5),
          0 0 60px 20px rgba(150,190,255,0.15),
          0 0 120px 40px rgba(100,150,255,0.08);
        opacity: 1;
      }
      50% {
        box-shadow:
          0 0 12px 4px rgba(255,255,255,1),
          0 0 35px 12px rgba(200,220,255,0.7),
          0 0 90px 35px rgba(150,190,255,0.25),
          0 0 180px 60px rgba(100,150,255,0.12);
        opacity: 0.85;
      }
    }

    .container {
      width: 80%;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
      padding-top: 120px;
    }

    /* Thin crosshair lines emanating from polaris position */
    .container::before {
      content: '';
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 100vh;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(180,210,255,0.06) 20%,
        rgba(180,210,255,0.12) 40%,
        rgba(180,210,255,0.06) 60%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    #title {
      font-family: 'Cinzel', serif;
      font-weight: 300;
      font-size: 90px;
      letter-spacing: 22px;
      text-transform: uppercase;
      margin-bottom: 0;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #ddeeff 35%,
        #aaccff 65%,
        rgba(100,160,255,0.3) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(150,200,255,0.4))
              drop-shadow(0 0 80px rgba(100,160,255,0.15));
      animation: titleGlow 5s ease-in-out infinite, fadeUp 1.8s ease forwards;
      opacity: 0;
    }

    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 0 40px rgba(150,200,255,0.4)) drop-shadow(0 0 80px rgba(100,160,255,0.15)); }
      50%       { filter: drop-shadow(0 0 70px rgba(180,220,255,0.7)) drop-shadow(0 0 120px rgba(120,180,255,0.3)); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .author {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.35);
      margin-top: 10px;
      margin-bottom: 50px;
      opacity: 0;
      animation: fadeUp 1.8s ease 0.3s forwards;
    }

    .nav {
      margin: 0 0 60px 0;
      display: flex;
      justify-content: center;
      gap: 0;
      opacity: 0;
      animation: fadeUp 1.8s ease 0.5s forwards;
    }

    .nav a {
      margin: 0;
      padding: 12px 30px;
      text-decoration: none;
      color: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.1);
      border-right: none;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.5s ease;
      position: relative;
      overflow: hidden;
    }

    .nav a:last-child {
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .nav a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(180,210,255,0.08), transparent);
      transform: translateY(-100%);
      transition: transform 0.4s ease;
    }

    .nav a:hover {
      color: white;
      border-color: rgba(180,210,255,0.35);
      box-shadow: 0 0 20px rgba(150,190,255,0.1);
      letter-spacing: 4px;
    }

    .nav a:hover::before {
      transform: translateY(0);
    }

    .image-space {
      width: 65%;
      height: 340px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(180,210,255,0.12);
      box-shadow:
        0 0 60px rgba(100,150,255,0.08),
        0 0 120px rgba(80,120,220,0.05);
      opacity: 0;
      animation: fadeUp 1.8s ease 0.8s forwards;
    }

    .image-space img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) saturate(0.7) hue-rotate(10deg);
      transition: all 2s ease;
      transform: scale(1.05);
    }

    .image-space:hover img {
      filter: brightness(0.85) saturate(0.9);
      transform: scale(1.0);
    }

    /* Light thread from Polaris down into the image */
    .image-space::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom,
        rgba(180,210,255,0.4),
        rgba(180,210,255,0.1),
        transparent
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Vignette */
    .image-space::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body class="home">
  <div class="container">
    <h1 id="title">POLARIS</h1>
    <p class="author">by Sen</p>
    <div class="nav">
      <a href="page-2.html">Darkness</a>
      <a href="page-3.html">Distance</a>
      <a href="page-4.html">Light</a>
      <a href="page-5.html">Return</a>
    </div>
    <div class="image-space">
      <img src="https://images.unsplash.com/photo-1537420327992-d6e192287183?ixid=M3w3Nzk0OTl8MHwxfHNlYXJjaHwyfHxzdGFyfGVufDF8fHx8MTc3MTkzMjIxNHww&ixlib=rb-4.1.0&w=1080&q=80&fit=max&fm=jpg&cs=tinysrgb">
    </div>
  </div>
</body>
</html>
