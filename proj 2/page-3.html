<!DOCTYPE html>
<html>

  <title>Distance</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Share+Tech+Mono&display=swap');

    :root {
      --space-black: #00000f;
      --deep-blue: #020818;
      --star-white: rgba(255,255,255,0.9);
      --nebula: rgba(80,120,200,0.15);
    }

    body.page {
      background-color: var(--space-black);
      color: white;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Deep space background with drifting stars */
    body.page::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(30,60,120,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(20,40,100,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(10,20,80,0.15) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Star field */
    body.page::after {
      content: '';
      position: fixed;
      inset: 0;
