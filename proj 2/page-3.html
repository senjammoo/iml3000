<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Distance</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Share+Tech+Mono&display=swap');

    :root {
      --space-black: #00000f;
      --deep-blue: #020818;
      --star-white: rgba(255,255,255,0.9);
      --nebula: rgba(80,120,200,0.15);
    }

    body.page {
      background-color: var(--space-black);
      color: white;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Deep space background with drifting stars */
    body.page::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(30,60,120,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(20,40,100,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(10,20,80,0.15) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Star field */
    body.page::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 8%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 48% 35%, rgba(180,200,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 95%, rgba(255,255,255,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
      animation: drift 60s linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(0px) translateX(0px); }
      50%  { transform: translateY(-8px) translateX(4px); }
      100% { transform: translateY(0px) translateX(0px); }
    }

    .page-container {
      width: 70%;
      margin: 60px auto;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 80px;
      letter-spacing: 12px;
      margin-bottom: 30px;
      color: white;
      text-transform: uppercase;
      position: relative;
      animation: fadeInDown 1.2s ease forwards;
    }

    /* Faint echo behind title — distance effect */
    h1::after {
      content: 'Distance';
      position: absolute;
      top: 6px;
      left: 6px;
      color: rgba(80, 130, 220, 0.15);
      letter-spacing: 12px;
      pointer-events: none;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .text-space {
      font-size: 16px;
      line-height: 2.2;
      margin-bottom: 40px;
      padding: 24px 28px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1.5px;
      border-left: 1px solid rgba(80,120,220,0.3);
      background: linear-gradient(90deg, rgba(20,40,100,0.1), transparent);
      animation: fadeIn 1.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .image-space {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(80,120,220,0.2);
      box-shadow:
        0 0 60px rgba(20,50,150,0.2),
        0 0 120px rgba(10,30,100,0.1);
    }

    .image-space img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7) saturate(0.6) hue-rotate(10deg);
      transform: scale(1.05);
      transition: all 2s ease;
    }

    .image-space:hover img {
      filter: brightness(0.9) saturate(0.85) hue-rotate(10deg);
      transform: scale(1.0);
    }

    /* Horizontal light streak — like light crossing the void */
    .image-space::before {
      content: '';
      position: absolute;
      top: 50%;
      left: -100%;
      width: 300%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(150,180,255,0.3), transparent);
      animation: lightray 8s ease-in-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes lightray {
      0%   { transform: translateX(-30%) translateY(-60px); opacity: 0; }
      30%  { opacity: 1; }
      70%  { opacity: 0.5; }
      100% { transform: translateX(30%) translateY(60px); opacity: 0; }
    }

    .nav-page {
      display: flex;
      justify-content: space-between;
      margin-bottom: 50px;
    }

    .nav-page a {
      text-decoration: none;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(80,120,220,0.3);
      padding: 10px 28px;
      letter-spacing: 3px;
      font-size: 12px;
      text-transform: uppercase;
      transition: all 0.6s ease;
      position: relative;
      overflow: hidden;
    }

    .nav-page a::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(80,120,220,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .nav-page a:hover {
      color: white;
      border-color: rgba(150,180,255,0.6);
      box-shadow: 0 0 20px rgba(80,120,220,0.2);
      letter-spacing: 4px;
    }

    .nav-page a:hover::after {
      transform: translateX(100%);
    }
  </style>
</head>
<body class="page">
  <div class="page-container">
    <h1>Distance</h1>
    <div class="text-space">
      <p>
        The stars are far, but the light still reaches us.<br>
        Distance is not absence, it's perspective... <br>
        
      </p>
    </div>
    <div class="image-space">
      <img src="https://images.unsplash.com/photo-1768741552860-41f1ee104ab0?ixid=M3w3Nzk0OTl8MHwxfHNlYXJjaHw5fHxkaXN0YW5jZSUyMG5pZ2h0fGVufDF8fHx8MTc3MjU3OTU5N3ww&ixlib=rb-4.1.0&w=1080&q=80&fit=max&fm=jpg&cs=tinysrgb">
    </div>
    <div class="nav-page">
      <a href="page-2.html" class="back">← Back</a>
      <a href="page-4.html" class="next">Next →</a>
    </div>
  </div>
</body>
</html>
