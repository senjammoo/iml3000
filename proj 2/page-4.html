<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Light</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Share+Tech+Mono&display=swap');

    :root {
      --warm-white: #fffdf5;
      --gold: rgba(255, 220, 120, 0.8);
      --soft-gold: rgba(255, 200, 80, 0.15);
      --beam: rgba(255, 240, 180, 0.06);
    }

    body.page {
      background: radial-gradient(ellipse at 50% 0%, #1a1400 0%, #0a0800 40%, #000000 100%);
      color: var(--warm-white);
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Radiant light burst from top center */
    body.page::before {
      content: '';
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: conic-gradient(
        from 260deg at 50% 0%,
        transparent 0deg,
        var(--beam) 10deg,
        transparent 20deg,
        var(--beam) 30deg,
        transparent 40deg,
        var(--beam) 50deg,
        transparent 60deg,
        var(--beam) 70deg,
        transparent 80deg,
        var(--beam) 90deg,
        transparent 100deg
      );
      pointer-events: none;
      z-index: 0;
      animation: rotateSlow 20s linear infinite;
      opacity: 0.8;
    }

    /* Soft ambient glow pool */
    body.page::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(255,220,100,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes rotateSlow {
      from { transform: translateX(-50%) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scale(1.1); }
    }

    .page-container {
      width: 70%;
      margin: 60px auto;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 300;
      font-size: 82px;
      letter-spacing: 14px;
      margin-bottom: 30px;
      text-transform: uppercase;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #ffe88a 40%,
        #ffcc44 70%,
        rgba(255,180,0,0.4) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(255,200,80,0.5))
              drop-shadow(0 0 60px rgba(255,180,0,0.2));
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(255,200,80,0.5)) drop-shadow(0 0 60px rgba(255,180,0,0.2)); }
      50%       { filter: drop-shadow(0 0 50px rgba(255,220,100,0.8)) drop-shadow(0 0 90px rgba(255,200,50,0.4)); }
    }

    .text-space {
      font-size: 16px;
      line-height: 2.2;
      margin-bottom: 40px;
      padding: 24px 28px;
      color: rgba(255, 240, 200, 0.7);
      letter-spacing: 1.5px;
      border-left: 1px solid rgba(255, 200, 80, 0.3);
      background: linear-gradient(90deg, rgba(255,200,80,0.05), transparent);
      position: relative;
    }

    .text-space::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40px; height: 1px;
      background: rgba(255, 200, 80, 0.5);
    }

    .image-space {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,200,80,0.2);
      box-shadow:
        0 0 40px rgba(255,180,0,0.1),
        0 0 80px rgba(255,150,0,0.05);
    }

    .image-space img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) saturate(1.1) sepia(0.2);
      transition: all 1.5s ease;
    }

    .image-space:hover img {
      filter: brightness(1.1) saturate(1.3) sepia(0.1);
    }

    /* Light bloom sweeping across image */
    .image-space::before {
      content: '';
      position: absolute;
      top: 0;
      left: -200%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255, 230, 150, 0.12) 50%,
        transparent 70%
      );
      animation: bloom 5s ease-in-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes bloom {
      0%   { left: -60%; }
      100% { left: 160%; }
    }

    /* Soft vignette keeping edges warm-dark */
    .image-space::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .nav-page {
      display: flex;
      justify-content: space-between;
      margin-bottom: 50px;
    }

    .nav-page a {
      text-decoration: none;
      color: rgba(255, 220, 120, 0.6);
      border: 1px solid rgba(255, 200, 80, 0.25);
      padding: 10px 28px;
      letter-spacing: 3px;
      font-size: 12px;
      text-transform: uppercase;
      transition: all 0.5s ease;
      position: relative;
      overflow: hidden;
    }

    .nav-page a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,220,100,0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .nav-page a:hover {
      color: #fff8dc;
      border-color: rgba(255, 220, 100, 0.7);
      box-shadow: 0 0 20px rgba(255, 200, 80, 0.2),
                  0 0 40px rgba(255, 180, 0, 0.1);
      text-shadow: 0 0 10px rgba(255, 220, 100, 0.8);
    }

    .nav-page a:hover::before {
      transform: translateX(100%);
    }
  </style>
</head>
<body class="page">
  <div class="page-container">
    <h1>Light</h1>
    <div class="text-space">
      <p>
        Light cuts through the darkness.<br>
        It reflects, it reveals, it becomes direction, a path.
      </p>
    </div>
    <div class="image-space">
      <img src="https://images.unsplash.com/photo-1556943899-ec04e7100e1b?ixid=M3w3Nzk0OTl8MHwxfHNlYXJjaHwxfHxzdGFyJTIwbGlnaHR8ZW58MXx8fHwxNzcyNTc5NjMwfDA&ixlib=rb-4.1.0&w=1080&q=80&fit=max&fm=jpg&cs=tinysrgb">
    </div>
    <div class="nav-page">
      <a href="page-3.html" class="back">← Back</a>
      <a href="page-5.html" class="next">Next →</a>
    </div>
  </div>
</body>
</html>
