<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Light</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Share+Tech+Mono&display=swap');

    :root {
      --warm-white: #fffdf5;
      --gold: rgba(255, 220, 120, 0.8);
      --soft-gold: rgba(255, 200, 80, 0.15);
      --beam: rgba(255, 240, 180, 0.06);
    }

    body.page {
      background: radial-gradient(ellipse at 50% 0%, #1a1400 0%, #0a0800 40%, #000000 100%);
      color: var(--warm-white);
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Radiant light burst from top center */
    body.page::before {
      content: '';
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: conic-gradient(
        from 260deg at 50% 0%,
        transparent 0deg,
        var(--beam) 10deg,
        transparent 20deg,
        var(--beam) 30deg,
        transparent 40deg,
        var(--beam) 50deg,
        transparent 60deg,
        var(--beam) 70deg,
        transparent 80deg,
        var(--beam) 90deg,
        transparent 100deg
      );
      pointer-events: none;
      z-index: 0;
      animation: rotateSlow 20s linear infinite;
      opacity: 0.8;
    }

    /* Soft ambient glow pool */
    body.page::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(255,220,100,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes rotateSlow {
      from { transform: translateX(-50%) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      50%       { opacity: 1;
