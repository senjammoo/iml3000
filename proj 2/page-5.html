<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Return</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Share+Tech+Mono&display=swap');

    :root {
      --rose: rgba(255, 180, 160, 0.12);
      --blush: rgba(255, 200, 180, 0.06);
      --soft: rgba(255, 220, 200, 0.7);
      --dim: rgba(255, 200, 180, 0.3);
    }

    body.page {
      background: radial-gradient(ellipse at 50% 100%, #1a0a0f 0%, #0d0508 50%, #000000 100%);
      color: #fff5f0;
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Soft rising glow from bottom — like dawn returning */
    body.page::before {
      content: '';
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(ellipse at 50% 100%,
        rgba(255, 160, 120, 0.08) 0%,
        rgba(255, 100, 80, 0.04) 40%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 0;
      animation: rise 8s ease-in-out infinite;
    }

    /* Gentle breathing mist */
    body.page::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 80%, rgba(255,140,100,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(200,120,150,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: breathe 10s ease-in-out infinite;
    }

    @keyframes rise {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) translateY(0); }
      50%       { opacity: 1;   transform: translateX(-50%) translateY(-20px); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    .page-container {
      width: 70%;
      margin: 60px auto;
      text-align: left;
      position: relative;
      z-index: 1;
    }
